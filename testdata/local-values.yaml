# Sample local values.yaml for testing against Bitnami nginx chart
# Intentionally has structural differences to trigger breaking change detection

# Override image - matches upstream structure
image:
  registry: docker.io
  repository: bitnami/nginx
  tag: "1.25.0"

# Override replica count
replicaCount: 2

# Service config - intentionally using a flat string instead of map
# (upstream uses a map with type, port, etc.)
service: "ClusterIP:80"

# Resources - partially overridden block (missing new upstream keys)
resources:
  limits:
    cpu: 500m
    memory: 512Mi

# Ingress - extra keys not in upstream (orphan overrides)
ingress:
  enabled: true
  hostname: myapp.example.com
  customAnnotation: "my-value"

# Override that exists upstream as a map but we set as scalar
podSecurityContext: "restricted"

# Metrics - partial override
metrics:
  enabled: true
