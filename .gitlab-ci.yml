stages:
  - helm-upgrade-check

variables:
  CHART_PATH: "."

helm-upgrade-analysis:
  stage: helm-upgrade-check
  image:
    name: linuxarpan/copilot-support-agent:v3
  before_script:
    - test -n "$COPILOT_GITHUB_TOKEN"
    - export COPILOT_GITHUB_TOKEN="$COPILOT_GITHUB_TOKEN" copilot login
  script:
    - |
      /usr/local/bin/copilot-support-agent \
        --chart-path "$CHART_PATH" \
        --registry-username "${HELM_REGISTRY_USERNAME:-}" \
        --registry-password "${HELM_REGISTRY_PASSWORD:-}" | tee copilot-support-agent-output.log
    - echo "----- STRUCTURAL_DIFF_REPORT.md -----"
    - test -f STRUCTURAL_DIFF_REPORT.md && cat STRUCTURAL_DIFF_REPORT.md || echo "STRUCTURAL_DIFF_REPORT.md not generated"
    - echo "----- Readme.md -----"
    - test -f Readme.md && cat Readme.md || echo "Readme.md not generated"
  artifacts:
    when: always
    paths:
      - STRUCTURAL_DIFF_REPORT.md
      - Readme.md
      - copilot-support-agent-output.log
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
